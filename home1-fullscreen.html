<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Meta Fit Pro — Home 1</title>
<style>
*{box-sizing:border-box}html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#02090d}#screen{position:fixed;inset:0;width:100vw;height:100dvh;overflow:hidden;background:#02090d}#screen>img{position:absolute;inset:0;width:100%;height:100%;display:block;object-fit:fill}#monitor{position:absolute;left:1.2%;top:7.2%;width:97.6%;height:21%;z-index:8;overflow:hidden;border-radius:12px;background:#000}#monitor video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;display:block;background:#000}#playAd{display:none;position:absolute;inset:0;margin:auto;width:min(190px,70%);height:48px;align-items:center;justify-content:center;border:1px solid #00f58a;border-radius:999px;background:rgba(2,9,13,.92);color:#00f58a;font-weight:800;z-index:9;cursor:pointer}#start{position:absolute;right:3%;top:1%;width:15%;height:7%;z-index:10;border:0;background:transparent;cursor:pointer}.rotate{display:none;position:fixed;inset:0;z-index:50;background:#02090d;align-items:center;justify-content:center;text-align:center;padding:30px;font-family:Arial,sans-serif}.rotate strong{display:block;color:#00f58a;font-size:28px}.rotate span{display:block;color:#79ff9e;font-weight:700;margin-top:10px;line-height:1.4}@media (orientation:portrait) and (max-width:600px) and (max-height:950px){#screen{display:none}.rotate{display:flex}}
</style>
</head>
<body>
<div class="rotate"><div><strong>RUOTA IL TELEFONO</strong><span>Meta Fit Pro è progettato per essere visualizzato in orizzontale.</span></div></div>
<main id="screen">
<img src="file_000000005508820ab1067ae2ffd0a532.png" alt="Meta Fit Pro Home 1">
<div id="monitor"><video id="ad" autoplay muted playsinline webkit-playsinline preload="auto"><source src="spot-home1-2.mp4" type="video/mp4"></video><button id="playAd" type="button">AVVIA PUBBLICITÀ</button></div>
<button id="start" type="button" aria-label="Inizia Ora" onclick="location.href='home2.html'"></button>
</main>
<script>
const v=document.getElementById('ad'),b=document.getElementById('playAd');
v.muted=true;v.setAttribute('muted','');
async function playSpot(restart=false){try{if(restart)v.currentTime=0;await v.play();b.style.display='none'}catch(e){b.style.display='flex'}}
b.addEventListener('click',()=>playSpot(true));
v.addEventListener('ended',()=>{v.currentTime=0;b.style.display='flex'});
v.addEventListener('error',()=>{b.textContent='RIPROVA';b.style.display='flex'});
window.addEventListener('pageshow',()=>playSpot(false));
</script>
</body>
</html>
