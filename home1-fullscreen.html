<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Meta Fit Pro — Home 1</title><style>*{box-sizing:border-box}html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#02090d}#screen{position:fixed;inset:0;width:100vw;height:100dvh;overflow:hidden;background:#02090d}.stage{position:absolute;top:0;left:0;width:100vw;aspect-ratio:3/2;overflow:hidden}.stage>img{position:absolute;inset:0;width:100%;height:100%;display:block}.monitor{position:absolute;left:50%;top:6.8%;transform:translateX(-50%);height:42%;aspect-ratio:4/3;max-width:62%;z-index:8;overflow:hidden;border-radius:12px;background:#000}.monitor video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block;background:#000}#playAd{display:none;position:absolute;inset:0;margin:auto;width:190px;height:48px;align-items:center;justify-content:center;border:1px solid #00f58a;border-radius:999px;background:rgba(2,9,13,.92);color:#00f58a;font-weight:800;z-index:9}.start{position:absolute;right:3.1%;top:2.2%;width:12.8%;height:5.8%;border:0;background:transparent;cursor:pointer;z-index:10}.rotate{display:none;position:fixed;inset:0;background:#02090d;z-index:20;align-items:center;justify-content:center;text-align:center;padding:30px;font-family:Arial,sans-serif}.rotate strong{display:block;color:#00f58a;font-size:28px}.rotate span{display:block;color:#79ff9e;font-weight:700;margin-top:10px;line-height:1.4}@media (orientation:portrait) and (max-width:600px) and (max-height:950px){#screen{display:none}.rotate{display:flex}}</style></head><body><div class="rotate"><div><strong>RUOTA IL TELEFONO</strong><span>Meta Fit Pro è progettato per essere visualizzato in orizzontale.</span></div></div><main id="screen"><div class="stage"><img src="file_000000005508820ab1067ae2ffd0a532.png" alt="Meta Fit Pro Home 1"><div id="monitor" class="monitor"><video id="ad" muted playsinline webkit-playsinline preload="auto"></video><button id="playAd" type="button">AVVIA PUBBLICITÀ</button></div><button class="start" type="button" aria-label="Inizia Ora" onclick="location.href='home2.html'"></button></div></main><script>const playlist=['spot-home1-2.mp4','spot2.mp4','spot3.mp4'];let i=0;const v=document.getElementById('ad'),b=document.getElementById('playAd');v.muted=true;v.setAttribute('muted','');function loadSpot(){v.src=playlist[i];v.load()}async function playSpot(){try{await v.play();b.style.display='none'}catch(e){b.style.display='flex'}}v.addEventListener('ended',()=>{i=(i+1)%playlist.length;loadSpot();playSpot()});v.addEventListener('error',()=>{if(i<playlist.length-1){i++;loadSpot();playSpot()}else{b.textContent='AVVIA PUBBLICITÀ';b.style.display='flex'}});b.addEventListener('click',playSpot);window.addEventListener('pageshow',()=>{loadSpot();playSpot()});</script></body></html>
