<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Meta Fit Pro — Home 1</title>
<meta name="description" content="Benvenuto in Meta Fit Pro. Scopri gli allenamenti e accedi alle stanze.">
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#030b0f;color:#eefcf8;font-family:Arial,sans-serif}body{min-height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:12px;padding:12px}.stage{position:relative;width:min(100%,calc((100vh - 86px)*1920/1088));aspect-ratio:1920/1088;container-type:inline-size;overflow:hidden;background:#030b0f}.home{display:block;width:100%;height:100%;object-fit:contain}.monitor{position:absolute;left:69.270833333%;top:10.294117647%;width:28.333333333%;height:28.676470588%;background:#080e12;outline:0.1041667cqw solid #53616b;outline-offset:-0.1041667cqw;box-shadow:0.208333cqw 0.208333cqw 0.416667cqw #0008}.monitor video{position:absolute;left:2.941176471%;top:3.846153846%;width:94.117647059%;height:92.307692308%;object-fit:contain;background:#000}.monitor::after{content:"";position:absolute;right:5.5147%;bottom:1.60256%;width:3.67647%;height:0.96154%;background:#00dfbd}.toolbar{display:flex;justify-content:center;align-items:center;gap:10px;flex-wrap:wrap;min-height:38px}button{font:600 14px Arial,sans-serif;color:#eafff9;border:1px solid #2c4947;background:#0a211f;border-radius:8px;padding:9px 15px;cursor:pointer}button:hover,button:focus-visible{background:#123b34;border-color:#00dca9}button:focus-visible{outline:2px solid #00e8af;outline-offset:3px}.hint{font-size:12px;color:#a9c0b9;margin:0}.stage:fullscreen{width:100vw;height:100vh;aspect-ratio:auto;container-type:size}.stage:fullscreen .canvas{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(100cqw,calc(100cqh*1920/1088));aspect-ratio:1920/1088;container-type:inline-size}.canvas{position:relative;width:100%;height:auto;aspect-ratio:1920/1088}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
.cat{position:absolute;left:86.979166667%;top:64.338235294%;width:10%;height:9.926470588%;object-fit:contain;pointer-events:none}

.hotspot{position:absolute;z-index:5;display:block;border:0;padding:0;border-radius:6px;background:transparent;color:transparent;cursor:pointer}
.hotspot:hover{background:transparent}
.hotspot:focus-visible{outline:3px solid #b7ff2a;outline-offset:3px;background:#b7ff2a18}
.go-home{left:72.8%;top:2.5%;width:4.1%;height:6.5%}
.go-training{left:79.7%;top:2.5%;width:4.2%;height:6.5%}
.go-controls{left:93.8%;top:2.5%;width:4.1%;height:6.5%}
.go-start{left:38.95%;top:90.99%;width:21.98%;height:6.43%}
.toolbar{display:none!important}
</style>
</head>
<body>
<main class="stage" id="stage" aria-label="Vetrina Meta Fit Pro con monitor pubblicitario">
 <div class="canvas">
  <video id="home" class="home" src="assets/home1/allenamento-loop.mp4" autoplay muted loop playsinline preload="auto" aria-label="Tania e Alessandro si allenano nelle stanze"></video>
  <video id="cat" class="cat" src="assets/home1/gatto.webm" autoplay muted loop playsinline preload="auto" aria-label="Gatto sul divano rivolto verso Tania"></video>
  <div class="monitor" aria-label="Monitor pubblicitario in alto a destra">
   <video id="ads" src="assets/home1/spot-voce-musica.mp4" autoplay muted loop playsinline preload="auto" aria-label="Spot 1 e spot 2 in ripetizione continua"></video>
  </div>
  <a class="hotspot go-home" href="home1-fullscreen.html" aria-label="Home 1"></a>
  <a class="hotspot go-training" href="home4.html" aria-label="Scegli la stanza di allenamento"></a>
  <button class="hotspot go-controls" id="settings" type="button" aria-label="Controlli audio e visualizzazione"></button>
  <a class="hotspot go-start" href="home2.html" aria-label="Inizia ora — vai alla Home 2"></a>
 </div>
</main>
<nav id="controlli" class="toolbar" aria-label="Controlli della vetrina">
 <button id="sound" type="button" aria-pressed="false">Attiva voce e musica</button>
 <button id="toggle" type="button">Pausa</button>
 <button id="full" type="button">Schermo intero</button>
 <span class="hint">Spot 1 → Spot 2 → loop · Voce + musica</span>
</nav>
<p id="status" class="sr" role="status" aria-live="polite"></p>
<script>
const home=document.getElementById('home'),ads=document.getElementById('ads'),cat=document.getElementById('cat');
const videos=[home,ads,cat];
const sound=document.getElementById('sound'),toggle=document.getElementById('toggle');
const status=document.getElementById('status');
async function start(){const results=await Promise.allSettled(videos.map(v=>v.play()));if(results.some(r=>r.status==='rejected')){toggle.textContent='Avvia';status.textContent='Premi Avvia per riprodurre la vetrina.';}else{toggle.textContent='Pausa';}}
sound.addEventListener('click',()=>{ads.volume=1;ads.muted=!ads.muted;sound.textContent=ads.muted?'Attiva voce e musica':'Disattiva audio';sound.setAttribute('aria-pressed',String(!ads.muted));if(ads.paused)start();});
toggle.addEventListener('click',()=>{if(videos.some(v=>v.paused)){start();}else{videos.forEach(v=>v.pause());toggle.textContent='Riprendi';}});
document.getElementById('full').addEventListener('click',async()=>{try{if(document.fullscreenElement){await document.exitFullscreen();}else{await document.getElementById('stage').requestFullscreen();}}catch{status.textContent='Usa la funzione schermo intero del browser.';}});
for(const video of videos)video.addEventListener('error',()=>{status.className='hint';status.textContent='Il browser non riesce ad aprire il video. Prova con un browser aggiornato.';});
document.getElementById('settings').addEventListener('click',async()=>{
  if(document.fullscreenElement){try{await document.exitFullscreen();}catch{}}
  sound.focus();
});
videos.forEach(video=>video.addEventListener('pause',()=>{if(!video.ended)video.play().catch(()=>{});}));
['pointerdown','keydown','touchstart'].forEach(eventName=>window.addEventListener(eventName,()=>{ads.muted=false;ads.volume=1;ads.play().catch(()=>{});},{once:true,passive:true}));
start();
</script>
</body>
</html>
