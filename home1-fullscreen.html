<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Meta Fit Pro — Home 1</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#02090d}
#screen{position:fixed;inset:0;width:100vw;height:100dvh;overflow:hidden;background:#02090d}
.stage{position:absolute;top:0;left:0;width:100vw;aspect-ratio:3/2;overflow:hidden}
.stage>img{position:absolute;inset:0;width:100%;height:100%;display:block}
.monitor{position:absolute;left:50%;top:6.4%;transform:translateX(-50%);width:36%;aspect-ratio:4/3;max-width:620px;z-index:8;overflow:hidden;border-radius:12px;background:#000}
.monitor video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;object-position:center;display:block;background:#000;pointer-events:none}
.start{position:absolute;right:3.1%;top:2.2%;width:12.8%;height:5.8%;border:0;background:transparent;cursor:pointer;z-index:10}
.rotate{display:none;position:fixed;inset:0;background:#02090d;z-index:20;align-items:center;justify-content:center;text-align:center;padding:30px;font-family:Arial,sans-serif}
.rotate strong{display:block;color:#00f58a;font-size:28px}
.rotate span{display:block;color:#79ff9e;font-weight:700;margin-top:10px;line-height:1.4}
@media (orientation:landscape) and (max-width:1100px){.monitor{width:34%;top:6.2%;max-width:none}}
@media (orientation:portrait) and (max-width:600px) and (max-height:950px) and (hover:none) and (pointer:coarse){#screen{display:none}.rotate{display:flex}}
</style>
</head>
<body>
<div class="rotate"><div><strong>RUOTA IL TELEFONO</strong><span>Meta Fit Pro è progettato per essere visualizzato in orizzontale.</span></div></div>
<main id="screen"><div class="stage">
<img src="file_000000005508820ab1067ae2ffd0a532.png" alt="Meta Fit Pro Home 1">
<div id="monitor" class="monitor"><video id="ad" autoplay muted playsinline webkit-playsinline preload="auto" disablepictureinpicture controlslist="nodownload nofullscreen noremoteplayback" aria-label="Spot Meta Fit Pro in sequenza continua"></video></div>
<button class="start" type="button" aria-label="Inizia Ora" onclick="location.href='home2.html'"></button>
</div></main>
<script>
const playlist=['1 MFP_SPOT_STRAPPO_APPROVATO_10s_VOCE_FEMMINILE_01.mp4','MFP_SPOT_2_COMPATIBILE_UNIVERSALE_720P.mp4'];
let i=0,failed=0,audioEnabled=false;
const v=document.getElementById('ad');
v.controls=false;
v.disablePictureInPicture=true;
v.setAttribute('muted','');
function loadAndPlay(){v.src=playlist[i];v.muted=!audioEnabled;v.load();const p=v.play();if(p&&typeof p.catch==='function')p.catch(()=>{v.muted=true;v.setAttribute('muted','');v.play().catch(()=>{});});}
function nextSpot(){failed=0;i=(i+1)%playlist.length;loadAndPlay();}
v.addEventListener('ended',nextSpot);
v.addEventListener('error',()=>{failed++;if(failed<playlist.length){i=(i+1)%playlist.length;loadAndPlay();}});
v.addEventListener('pause',()=>{if(!v.ended)v.play().catch(()=>{});});
function enableAudio(){audioEnabled=true;v.muted=false;v.removeAttribute('muted');v.play().catch(()=>{});}
window.addEventListener('pointerdown',enableAudio,{once:true,capture:true});
window.addEventListener('keydown',enableAudio,{once:true,capture:true});
window.addEventListener('pageshow',()=>{failed=0;i=0;loadAndPlay();});
</script>
</body>
</html>
