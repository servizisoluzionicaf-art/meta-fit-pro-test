<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Meta Fit Pro Home 1 Test</title><style>*{box-sizing:border-box}html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#02090d}#screen{position:fixed;inset:0;width:100vw;height:100dvh;overflow:hidden;background:#02090d;display:flex;align-items:flex-start;justify-content:center}#screen>img{width:100%;height:auto;max-width:none;display:block}#monitor{position:absolute;left:1.2%;top:6.8%;width:97.6%;height:21.7%;z-index:8;overflow:hidden;border-radius:12px;background:#000}#monitor video{width:100%;height:100%;object-fit:contain;display:block;background:#000}#playAd{display:none;position:absolute;inset:0;margin:auto;width:max-content;height:max-content;padding:10px 18px;border:1px solid #00f58a;border-radius:999px;background:rgba(2,9,13,.88);color:#00f58a;font-weight:800;z-index:9}#start{position:absolute;right:3%;top:1%;width:15%;height:7%;z-index:10;border:0;background:transparent;cursor:pointer}.rotate{display:none;position:fixed;inset:0;z-index:50;background:#02090d;align-items:center;justify-content:center;text-align:center;font-family:Arial}.rotate strong{display:block;color:#00f58a;font-size:28px}.rotate span{display:block;color:#79ff9e;font-weight:700;margin-top:10px}@media(orientation:portrait) and (max-width:900px){#screen{display:none}.rotate{display:flex}}</style></head><body><div class="rotate"><div><strong>RUOTA IL TELEFONO</strong><span>Meta Fit Pro è progettato per essere visualizzato in orizzontale.</span></div></div><main id="screen"><img src="file_000000005508820ab1067ae2ffd0a532.png" alt="Meta Fit Pro"><div id="monitor"><video id="ad" autoplay muted loop playsinline webkit-playsinline preload="auto"><source src="spot-home1-2.mp4" type="video/mp4"></video><button id="playAd" type="button">AVVIA PUBBLICITÀ</button></div><button id="start" aria-label="Inizia Ora" onclick="location.href='home2.html'"></button></main><script>const v=document.getElementById('ad'),b=document.getElementById('playAd');async function startAd(){try{v.muted=true;await v.play();b.style.display='none'}catch(e){b.style.display='block'}}window.addEventListener('load',startAd);v.addEventListener('canplay',startAd);v.addEventListener('error',()=>b.style.display='block');b.addEventListener('click',startAd);document.addEventListener('touchstart',startAd,{once:true,passive:true});</script></body></html>
