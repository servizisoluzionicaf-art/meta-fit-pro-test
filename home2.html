<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Meta Fit Pro — HOME 2</title>
<style>
html,body{margin:0;background:#000;color:#fff;font-family:Arial,Helvetica,sans-serif}
.page{max-width:1536px;margin:0 auto;background:#000}
.header img,.body img{display:block;width:100%;height:auto}
.ad-wrap{background:#000;padding:10px 18px 14px;box-sizing:border-box}
.ad-label{text-align:center;color:#b7ff2a;font-weight:900;letter-spacing:1.5px;font-size:13px;margin:0 0 8px}
.ad-frame{position:relative;max-width:1120px;margin:0 auto;border:1px solid #4f6c23;border-radius:16px;overflow:hidden;box-shadow:0 0 28px rgba(183,255,42,.16)}
.ad-frame video{display:block;width:100%;height:auto;background:#000}
.sound-btn{position:absolute;right:14px;bottom:14px;border:1px solid #b7ff2a;background:rgba(0,0,0,.78);color:#b7ff2a;border-radius:999px;padding:11px 17px;font-weight:900;cursor:pointer}
.note{text-align:center;color:#899289;font-size:11px;margin-top:7px}
@media(max-width:700px){
  .ad-wrap{padding:6px 8px 10px}
  .ad-label{font-size:10px}
  .sound-btn{right:8px;bottom:8px;padding:9px 12px;font-size:12px}
}

/* MFP: ingresso stanza, isolato dalla grafica originale. */
.body{position:relative}
#mfp-door{position:absolute;left:58.4%;top:17.2%;width:12%;height:24.2%;display:flex;align-items:flex-end;justify-content:center;box-sizing:border-box;padding:0 3px 12%;padding-bottom:12px;overflow:hidden;border:2px solid #526542;background:linear-gradient(100deg,#172017,#080d09 65%,#263020);box-shadow:inset 0 0 0 5px #0a0e0b,0 4px 15px #0008;color:#c8ff32;text-decoration:none;perspective:600px}
#mfp-door::before{content:"";position:absolute;inset:6px;background:linear-gradient(105deg,#263027,#0c130e 70%);border:1px solid #47533d;transform-origin:left;transition:transform 1s ease,box-shadow .5s}
#mfp-door::after{content:"";position:absolute;right:12%;top:52%;width:4px;height:12%;border-radius:4px;background:#b1be9a;box-shadow:0 0 3px #fff4}
#mfp-door span{position:relative;z-index:1;font:bold clamp(10px,1.2vw,16px) Arial;letter-spacing:.08em;padding:8px 5px;background:#09110de8;border:1px solid #8dc745;border-radius:4px}
#mfp-door:focus-visible{outline:3px solid #c8ff32;outline-offset:4px}
#mfp-door.mfp-opening{box-shadow:0 0 26px #89ff48,inset 0 0 35px #9aff51;background:#86fb45}
#mfp-door.mfp-opening::before{transform:rotateY(-78deg);box-shadow:0 0 30px #b4ff74}
#mfp-door.mfp-opening::after{opacity:0}
#mfp-arrival{position:fixed;inset:0;z-index:100000;background:#061006;overflow:hidden;clip-path:circle(0% at var(--door-x,65%) var(--door-y,35%))}
#mfp-arrival[hidden]{display:none}
#mfp-arrival.mfp-reveal{animation:mfp-spread 2.6s cubic-bezier(.2,.65,.25,1) both}
#mfp-arrival img{width:100%;height:100%;object-fit:cover;opacity:0;filter:brightness(.18);transform:scale(1.08)}
#mfp-arrival.mfp-reveal img{animation:mfp-room 2.6s ease both}
#mfp-arrival::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at var(--door-x,65%) var(--door-y,35%),#ceff9acc 0,#87ff4888 25%,#40cd2433 55%,transparent 80%);mix-blend-mode:screen}
#mfp-arrival.mfp-reveal::after{animation:mfp-light 2.6s ease both}
#mfp-arrival-close{position:absolute;z-index:1;top:20px;right:20px;width:44px;height:44px;border:1px solid #c8ff32;border-radius:50%;background:#071000db;color:#fff;font-size:24px;cursor:pointer}
@keyframes mfp-spread{0%{clip-path:circle(0% at var(--door-x) var(--door-y))}100%{clip-path:circle(150% at var(--door-x) var(--door-y))}}
@keyframes mfp-room{0%,15%{opacity:0;filter:brightness(.18);transform:scale(1.08)}80%,100%{opacity:1;filter:brightness(1);transform:scale(1)}}
@keyframes mfp-light{0%{opacity:0}25%{opacity:1}100%{opacity:0}}
@media(prefers-reduced-motion:reduce){#mfp-door::before{transition:none}#mfp-arrival.mfp-reveal,#mfp-arrival.mfp-reveal img,#mfp-arrival.mfp-reveal::after{animation:none}}
</style>
</head>

<script>
(() => {
  const door = document.getElementById('mfp-door');
  const arrival = document.getElementById('mfp-arrival');
  const close = document.getElementById('mfp-arrival-close');
  const page = document.querySelector('.page');
  const navigation = [
    document.getElementById('mfp-flow-nav'),
    document.getElementById('mfp-continua-home3')
  ];
  let active = false;
  let startTimer;
  let finishTimer;
  function restore() {
    clearTimeout(startTimer);
    clearTimeout(finishTimer);
    active = false;
    arrival.hidden = true;
    arrival.classList.remove('mfp-reveal');
    door.classList.remove('mfp-opening');
    page.inert = false;
    navigation.forEach(el => { if (el) el.inert = false; });
  }
  function enter() {
    if (!active) return;
    restore();
    window.location.assign(door.href);
  }
  function cancel() {
    restore();
    door.focus();
  }
  door.addEventListener('click', event => {
    // Conserva l'apertura nativa in una nuova scheda.
    if (event.button !== 0 || event.ctrlKey || event.metaKey || event.shiftKey || event.altKey) return;
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    event.preventDefault();
    if (active) return;
    active = true;
    const rect = door.getBoundingClientRect();
    arrival.style.setProperty('--door-x', ((rect.left + rect.width / 2) / window.innerWidth * 100) + '%');
    arrival.style.setProperty('--door-y', ((rect.top + rect.height / 2) / window.innerHeight * 100) + '%');
    door.classList.add('mfp-opening');
    startTimer = setTimeout(() => {
      if (!active) return;
      arrival.hidden = false;
      arrival.classList.add('mfp-reveal');
      close.focus();
      page.inert = true;
      navigation.forEach(el => { if (el) el.inert = true; });
      // Riserva nel caso il browser non emetta animationend.
      finishTimer = setTimeout(enter, 3100);
    }, 420);
  });
  arrival.addEventListener('animationend', event => {
    if (event.target === arrival && event.animationName === 'mfp-spread') enter();
  });
  close.addEventListener('click', cancel);
  document.addEventListener('keydown', event => {
    if (!active) return;
    if (event.key === 'Escape') { event.preventDefault(); cancel(); }
    if (!arrival.hidden && event.key === 'Tab') { event.preventDefault(); close.focus(); }
  });
  window.addEventListener('pageshow', restore);
})();
</script>
