<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#02090d">
<title>Meta Fit Pro — Home 1</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#02090d;overflow:hidden;font-family:Arial,Helvetica,sans-serif}body{position:fixed;inset:0}.rotate{display:none;position:fixed;inset:0;z-index:100;background:#02090d;color:#fff;align-items:center;justify-content:center;text-align:center;padding:30px}.rotate b{display:block;color:#00f58a;font-size:26px;margin-bottom:10px}.home{position:fixed;inset:0;width:100vw;height:100dvh;overflow:hidden;background:#02090d}.art{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;display:block}.monitor{position:absolute;left:1.15%;top:5.75%;width:97.7%;height:19.45%;overflow:hidden;border-radius:14px;background:#000;z-index:5;box-shadow:0 0 0 1px rgba(0,245,138,.35)}.monitor video{width:100%;height:100%;object-fit:cover;display:block;background:#000}.start{position:absolute;right:4.6%;top:1.05%;width:11%;height:4.1%;border:0;background:transparent;cursor:pointer;z-index:10}.fallback{display:none;position:absolute;inset:0;z-index:8;border:0;background:rgba(0,0,0,.45);color:#fff;font-weight:800;font-size:16px}@media(orientation:portrait){.home{display:none}.rotate{display:flex}}
</style>
</head>
<body>
<div class="rotate"><div><b>RUOTA IL TELEFONO</b>Meta Fit Pro è progettato per essere visualizzato in orizzontale.</div></div>
<main class="home">
<img class="art" src="home1-presentazione.png" alt="Meta Fit Pro Home 1">
<div class="monitor"><video id="spot" autoplay muted loop playsinline webkit-playsinline preload="auto"><source src="spot-home1.mp4" type="video/mp4"></video><button id="fallback" class="fallback" type="button">TOCCA PER AVVIARE LA PUBBLICITÀ</button></div>
<button class="start" aria-label="Inizia Ora" onclick="location.href='home2.html'"></button>
</main>
<script>
const v=document.getElementById('spot'),b=document.getElementById('fallback');async function playSpot(){try{v.muted=true;await v.play();b.style.display='none'}catch(e){b.style.display='block'}}v.addEventListener('canplay',playSpot);v.addEventListener('error',()=>b.style.display='block');b.addEventListener('click',playSpot);document.addEventListener('touchstart',playSpot,{once:true,passive:true});window.addEventListener('load',playSpot);
</script>
</body>
</html>
